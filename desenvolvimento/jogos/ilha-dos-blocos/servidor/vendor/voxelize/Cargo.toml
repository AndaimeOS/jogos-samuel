[package]
edition = "2021"
name = "voxelize"
version = "3.0.0"
build = "build.rs"
include = [
    "/server/**/*.rs",
    "/benches/**/*.rs",
    "/build.rs",
    "/messages.proto",
    "/packages/protocol/src/protocol-version.json",
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A fast multiplayer voxel engine."
readme = "README.md"
license = "MIT"
repository = "https://github.com/voxelize/voxelize"

[features]
default = []
profiling = ["pprof"]

[lib]
name = "voxelize"
path = "server/lib.rs"

[[bench]]
name = "lights_bench"
path = "benches/lights_bench.rs"
harness = false

[[bench]]
name = "mesher_bench"
