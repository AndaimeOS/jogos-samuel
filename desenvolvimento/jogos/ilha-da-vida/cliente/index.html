<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Ilha da Vida</title>
<style>
  :root { --paper:#F5F2E8; --ink:#193337; --play:#B9ED80; --orange:#FF9D52; --lilac:#CEB7EF; --focus:#9956E0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #1d3a40; color: var(--ink);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .tela { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .janela { width: min(460px, 100%); background: var(--paper); border: 2px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); }
  .barra { background: var(--lilac); border-bottom: 2px solid var(--ink); padding: 6px 10px; font: 900 15px "Courier New", monospace; }
  .corpo { padding: 18px; }
  h1 { font: 900 30px "Courier New", monospace; margin: 0 0 6px; }
  p { margin: 0 0 14px; }
  label { display: block; font-weight: 700; margin: 12px 0 4px; }
  input { width: 100%; min-height: 48px; padding: 8px 10px; font-size: 18px; border: 2px solid var(--ink); background: #fff; color: var(--ink); }
  input:focus, button:focus { outline: 3px solid var(--focus); outline-offset: 2px; }
  button { width: 100%; min-height: 56px; margin-top: 18px; font: 900 22px "Courier New", monospace; background: var(--play);
    border: 2px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); cursor: pointer; color: var(--ink); }
  button:disabled { opacity: .55; cursor: wait; }
  .aviso { min-height: 1.4em; margin-top: 12px; font-weight: 700; }
  .aviso.erro { color: #a3241b; }
  .dicas { font-size: 14px; margin-top: 14px; }
  .dicas li { margin-bottom: 4px; }
  a { color: var(--ink); font-weight: 700; }
  #progresso { white-space: pre-wrap; font: 13px "Courier New", monospace; max-height: 9em; overflow: auto; margin-top: 10px; }
</style>
</head>
<body>
<div class="tela" id="tela">
  <div class="janela">
    <div class="barra">ilha-da-vida.exe</div>
    <div class="corpo">
      <h1>Ilha da Vida</h1>
      <p>Sobrevivência em blocos: junte madeira, faça ferramentas e construa um abrigo antes da noite.</p>
      <form id="entrar" autocomplete="off">
        <label for="nome">Apelido do explorador</label>
        <input id="nome" required maxlength="19" pattern="[A-Za-z0-9_\-]{1,19}" placeholder="ex.: Explorador1"
               title="Só letras sem acento, números, - e _ (até 19)">
        <label for="senha">Senha da família</label>
        <input id="senha" type="password" required>
        <button id="botao" type="submit" disabled>Carregando…</button>
      </form>
      <div class="aviso" id="aviso" role="status"></div>
      <div id="progresso" aria-live="polite"></div>
      <ul class="dicas">
        <li>Melhor no computador: teclado e mouse (W A S D, clique para quebrar e colocar).</li>
        <li>O mundo é da família e fica salvo no servidor.</li>
      </ul>
      <p><a href="https://samuel.tech/jogos/">← Voltar aos jogos</a></p>
    </div>
  </div>
</div>
<script src="%__RELEASE_UUID__%/launcher.js"></script>
<script>
  // Ilha da Vida — cliente Luanti (WebAssembly) ligado ao servidor da família pela ponte /vida/ desta mesma origem.
  // A senha da família abre a ponte (?c=) e também é a senha da conta do apelido no servidor (registro na 1ª vez).
  const aviso = document.getElementById('aviso');
  const progresso = document.getElementById('progresso');
  const botao = document.getElementById('botao');
  const linhas = new Map();

  function mostrar(texto, erro) { aviso.textContent = texto; aviso.className = 'aviso' + (erro ? ' erro' : ''); }
  function urlPonte(codigo) { return 'wss://' + location.host + '/vida/?c=' + encodeURIComponent(codigo); }

  // Confere a senha antes de abrir o jogo: a ponte recusa (403) a conexão com senha errada.
  function conferirSenha(codigo) {
    return new Promise((ok) => {
      let ws;
      try { ws = new WebSocket(urlPonte(codigo)); } catch (e) { ok(false); return; }
      const fim = setTimeout(() => { try { ws.close(); } catch (e) {} ok(false); }, 8000);
      ws.onopen = () => { clearTimeout(fim); ws.close(); ok(true); };
      ws.onerror = () => { clearTimeout(fim); ok(false); };
    });
  }

  const mtl = new LuantiLauncher();
  mtl.onprogress = (nome, p) => {
    linhas.set(nome, Math.round(p * 100) + '%');
    progresso.textContent = [...linhas].map(([n, v]) => n + ': ' + v).join('\n');
  };
  mtl.onready = () => { botao.disabled = false; botao.textContent = 'Entrar na ilha'; progresso.textContent = ''; };
  mtl.onerror = (err) => { mostrar('Não deu para carregar o jogo neste navegador. Tente o Chrome ou o Edge no computador.', true); console.error(err); };
  mtl.onexit = () => { location.reload(); };

  document.getElementById('entrar').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const nome = document.getElementById('nome').value.trim();
    const codigo = document.getElementById('senha').value.trim().toLowerCase();
    if (!/^[A-Za-z0-9_-]{1,19}$/.test(nome)) { mostrar('Apelido: só letras sem acento, números, - e _.', true); return; }
    botao.disabled = true; mostrar('Conferindo a senha…');
    if (!(await conferirSenha(codigo))) { botao.disabled = false; mostrar('Senha errada (ou servidor fora do ar).', true); return; }
    mostrar('Entrando…');
    const args = new LuantiArgs();
    args.name = nome;
    args.password = codigo;
    args.address = '127.0.0.2';   // a ponte só deixa falar com o servidor da família (127.0.0.1 seria o servidor DENTRO do navegador)
    args.port = 30000;
    args.go = true;
    mtl.setProxy(urlPonte(codigo));
    mtl.setLang('pt_BR');
    mtl.setConf('viewing_range', 85);
    document.getElementById('tela').remove();
    mtl.launch(args);
  });
</script>
</body>
</html>
