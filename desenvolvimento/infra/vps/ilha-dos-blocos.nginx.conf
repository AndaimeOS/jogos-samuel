# /etc/nginx/conf.d/ilha-dos-blocos.conf — servidor da Ilha dos Blocos em https/wss na porta 8443.
# Porta própria porque o cliente do Voxelize sempre usa /ws/ e /registry/ na raiz, que é do painel de jogos (AMP).
# Reaproveita o certificado Let's Encrypt do hostname (renovado pelo certbot já instalado).
# Rotas: /ws/ (Ilha dos Blocos, só vindo do samuel.tech, com limite por IP), /registry/ (GET), /saude e /vida/
# (ponte da Ilha da Vida, com senha), /vida/jogo/ (cliente estático da Ilha da Vida). O resto é 404.

limit_req_zone  $binary_remote_addr zone=ilha_ws:1m rate=60r/m;   # reconexão automática do motor ~3 s; famílias atrás do mesmo roteador
limit_conn_zone $binary_remote_addr zone=ilha_con:1m;

# Ilha da Vida (Luanti): a senha (a mesma da Ilha dos Blocos) vem em ?c= na URL da ponte. O mapa com o valor fica só na
# VPS, fora do Git: /etc/nginx/segredos/ilha-vida-codigo.map → map $arg_c $vida_codigo_ok { default 0; "<código>" 1; ... }
include /etc/nginx/segredos/ilha-vida-codigo.map;
limit_req_zone  $binary_remote_addr zone=vida_ws:1m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=vida_con:1m;

map $http_origin $ilha_origem_ok {
    default                 0;
    "https://samuel.tech"   1;
    "https://www.samuel.tech" 1;
}

# A ponte da Ilha da Vida também aceita a página do próprio cliente, servida aqui em /vida/jogo/.
map $http_origin $vida_origem_ok {
    default                                  0;
    "https://samuel.tech"                    1;
    "https://www.samuel.tech"                1;
    "https://srv2114451.hstgr.cloud:8443"    1;
}

# Origem + senha escolhem o destino em vez de `if … return 403`: o `return` roda antes do limit_req e deixaria tentar
# senhas sem limite. Negado vai para o 403 interno abaixo, já contado pelo limite por IP.
map "$vida_origem_ok$vida_codigo_ok" $vida_destino {
    default   "127.0.0.1:7779";
    "11"      "127.0.0.1:7777";
}

server {
    listen 127.0.0.1:7779;
    access_log off;
    return 403;
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    server_name srv2114451.hstgr.cloud;

    ssl_certificate /etc/letsencrypt/live/srv2114451.hstgr.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/srv2114451.hstgr.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # sem logs com IP nem query string (a URL do WebSocket leva o código da ilha)
    access_log off;
    error_log /var/log/nginx/ilha-erros.log crit;
    client_max_body_size 64k;

    location = /ws/ {
        if ($ilha_origem_ok = 0) { return 403; }
        limit_req zone=ilha_ws burst=20 nodelay;
        limit_conn ilha_con 6;
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Ilha da Vida: ponte WebSocket → servidor Luanti (127.0.0.2:30000), só com a senha e vindo do samuel.tech ou do próprio cliente
    location = /vida/ {
        limit_req zone=vida_ws burst=20 nodelay;
        limit_conn vida_con 8;
        proxy_pass http://$vida_destino/;   # com variável, a URI "/" vai sem a query: a ponte não recebe a senha
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Ilha da Vida: cliente Luanti em WebAssembly (estático). Precisa de isolamento entre origens (SharedArrayBuffer),
    # por isso abre em página própria e não no iframe do portal.
    location ^~ /vida/jogo/ {
        alias /opt/vida/www/;
        limit_except GET { deny all; }
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache" always;   # revalida por ETag (304); a pasta da versão muda a cada build
        types { text/html html; text/javascript js; application/wasm wasm; application/octet-stream pack; text/css css; }
        default_type application/octet-stream;
        gzip on; gzip_types application/wasm text/javascript application/octet-stream;
    }

    location ^~ /registry/ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:4100;
        proxy_set_header Host $host;
    }

    # saúde: responde (com CORS do servidor) só se o servidor da ilha estiver de pé
    location = /saude {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:4100/;
        proxy_set_header Host $host;
    }

    location / { return 404; }
}
