# Ilha da Vida (samuel.tech) — servidor Luanti + VoxeLibre. Só escuta em loopback (127.0.0.2): entra-se pela ponte com senha.
# 127.0.0.2 e não .1: no cliente web (emsocket) 127.0.0.1 é o servidor DENTRO do navegador; .2 vai pela ponte
bind_address = 127.0.0.2
port = 30000
server_name = Ilha da Vida
server_description = Ilha da Vida — samuel.tech
server_announce = false
enable_damage = true
creative_mode = false
enable_pvp = false
# monstros desligados (decisão de 14/11/2026: na 1ª entrada um Stalker explodia o jogador em segundos). Para ligar: false
only_peaceful_mobs = true
disallow_empty_password = true
max_users = 15
# sem chat livre (regra do site): jogador novo só interage, não fala
default_privs = interact
enable_rollback_recording = true
strict_protocol_version_checking = false
