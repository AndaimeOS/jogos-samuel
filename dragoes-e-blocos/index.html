<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Dragões & Blocos</title>
<meta name="description" content="Guie o dragão e derrube a muralha de blocos antes que ela chegue até você.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐉</text></svg>">
<!--
  Jogo do Samuel. Canvas puro, sem build.
  Arte: Kenney New Platformer Pack (CC0), em assets/. Fonte: Kenney Future (CC0), em ../vendor/kenney-fonts.
-->
<style>
  @font-face { font-family: KenneyFuture; src: url(../vendor/kenney-fonts/kenney-future.ttf) format('truetype'); font-display: block; }
  :root {
    --sky: #c7ecff;
    --ink: #2b2b55;
    --muted: #5d6290;
    --accent: #ffcc33;
    --accent-2: #ff8a1f;
    --green: #5ac54f;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body {
    margin: 0; height: 100%; background: linear-gradient(#a8e1ff, #e6f7ff); color: var(--ink);
    font-family: KenneyFuture, "Trebuchet MS", system-ui, sans-serif;
    overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #wrap { position: relative; width: 100vw; height: 100vh; height: 100dvh; display: grid; place-items: center; }
  canvas { display: block; border-radius: 22px; border: 5px solid var(--ink); box-shadow: 0 8px 0 #2b2b5533, 0 20px 50px rgba(0,0,0,.2); background: var(--sky); }
  .overlay { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; background: rgba(43, 43, 85, .3); }
  .card {
    background: #fff; border: 5px solid var(--ink); border-radius: 28px; padding: 24px 20px;
    max-width: 380px; width: 100%; text-align: center; box-shadow: 0 10px 0 #2b2b5533, 0 20px 50px rgba(0,0,0,.25);
  }
  .card h1 { margin: 0 0 4px; font-size: 34px; color: var(--green); text-shadow: 3px 3px 0 var(--ink); }
  .card h2 { margin: 0 0 8px; font-size: 30px; color: var(--accent-2); text-shadow: 2px 2px 0 var(--ink); }
  .card p { margin: 8px 0; font-size: 19px; line-height: 1.35; color: var(--muted); font-family: "Trebuchet MS", system-ui, sans-serif; font-weight: bold; }
  .card p b { color: var(--ink); font-family: KenneyFuture, sans-serif; }
  .big { font-size: 60px; line-height: 1; margin: 4px 0; }
  .help { display: flex; justify-content: center; gap: 12px; margin: 10px 0 4px; }
  .help figure { margin: 0; width: 70px; }
  .help img { width: 40px; height: 40px; }
  .help figcaption { font-family: "Trebuchet MS", system-ui, sans-serif; font-weight: bold; font-size: 12px; color: var(--muted); }
  button {
    font: inherit; font-size: 24px; cursor: pointer; color: var(--ink); min-height: 64px;
    background: linear-gradient(#8ee07f, var(--green)); border: 4px solid var(--ink); border-radius: 20px;
    padding: 10px 32px; margin-top: 12px; box-shadow: 0 6px 0 var(--ink); transition: transform .08s;
  }
  button:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--ink); }
  button:focus-visible { outline: 4px solid var(--accent-2); outline-offset: 3px; }
  .link { display: inline-block; margin-top: 14px; padding: 8px; color: var(--muted); font-size: 17px; }
  #hudBtns { position: absolute; top: 12px; right: 12px; display: flex; gap: 8px; }
  #hudBtns button { width: 54px; height: 54px; min-height: 0; padding: 0; margin: 0; font-size: 22px; background: #fff; border-radius: 16px; box-shadow: 0 4px 0 var(--ink); }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" aria-label="Dragões & Blocos"></canvas>

  <div id="hudBtns" hidden>
    <button id="btnSound" aria-label="Som">🔊</button>
    <button id="btnPause" aria-label="Pausar">⏸</button>
  </div>

  <div class="overlay" id="startScreen">
    <div class="card">
      <div class="big">🐉</div>
      <h1>Dragões &amp; Blocos</h1>
      <p>A muralha está descendo! Cuspa fogo e não deixe os blocos chegarem no seu dragão.</p>
      <div class="help">
        <figure><img src="assets/gem_blue.png" alt=""><figcaption>+50 pontos</figcaption></figure>
        <figure><img src="assets/fireball.png" alt=""><figcaption>Fogo rápido</figcaption></figure>
        <figure><img src="assets/star.png" alt=""><figcaption>Fogo triplo</figcaption></figure>
        <figure><img src="assets/heart.png" alt=""><figcaption>Proteção</figcaption></figure>
      </div>
      <p>👆 Arraste o dedo · ⌨️ setas</p>
      <button id="btnStart">Jogar!</button>
      <div><a class="link" href="../">← Voltar aos jogos</a></div>
    </div>
  </div>

  <div class="overlay" id="pauseScreen" hidden>
    <div class="card">
      <h2>Pausado</h2>
      <button id="btnResume">Continuar</button>
    </div>
  </div>

  <div class="overlay" id="overScreen" hidden>
    <div class="card">
      <div class="big">💥</div>
      <h2>Os blocos chegaram!</h2>
      <p>Pontos: <b id="finalScore">0</b></p>
      <p>Nível: <b id="finalLevel">1</b></p>
      <p id="bestLine">Recorde: <b id="bestScore">0</b></p>
      <button id="btnAgain">Jogar de novo</button>
      <div><a class="link" href="../">← Voltar aos jogos</a></div>
    </div>
  </div>
</div>

<script>
(() => {
  const W = 480, H = 720;
  const COLS = 8, CELL = W / COLS, BW = CELL - 6, BH = 46, ROW_GAP = 6;
  const HUD_H = 52;
  const POWER_TIME = 8;
  const INK = '#2b2b55';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const $ = id => document.getElementById(id);

  // ---------- Imagens (Kenney, CC0) ----------
  const IMG = {};
  ['block_blue', 'block_yellow', 'block_red', 'block_coin', 'block_exclamation', 'fireball', 'star', 'heart',
   'gem_blue', 'background_color_hills', 'background_clouds', 'hud_coin'].forEach(n => {
    const im = new Image(); im.src = 'assets/' + n + '.png'; IMG[n] = im;
  });
  const ready = im => im.complete && im.naturalWidth > 0;
  const draw = (n, x, y, w, h) => { if (ready(IMG[n])) ctx.drawImage(IMG[n], x, y, w, h); };

  // ---------- Armazenamento (pode falhar em janela privada) ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };

  // ---------- Tela ----------
  function resize() {
    if (!innerWidth || !innerHeight) return;   // aba oculta pode reportar 0
    const scale = Math.min((window.innerWidth - 16) / W, (window.innerHeight - 16) / H);
    const cssW = Math.floor(W * scale), cssH = Math.floor(H * scale);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';
    canvas.width = Math.floor(W * dpr * scale);
    canvas.height = Math.floor(H * dpr * scale);
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
    ctx.imageSmoothingQuality = 'high';
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- Som ----------
  let audio = null;
  let soundOn = store.get('db-sound', true);
  function beep(freq, dur = 0.08, type = 'square', vol = 0.06, slide = 0) {
    if (!soundOn) return;
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const t = audio.currentTime;
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(audio.destination);
      o.start(t); o.stop(t + dur);
    } catch {}
  }
  const sfx = {
    shoot: () => beep(520, 0.05, 'triangle', 0.025, 200),
    hit: () => beep(220, 0.05, 'square', 0.03),
    smash: () => beep(140, 0.15, 'sawtooth', 0.05, -80),
    gem: () => { beep(880, 0.08, 'sine', 0.06); setTimeout(() => beep(1320, 0.1, 'sine', 0.06), 70); },
    power: () => { beep(440, 0.08, 'triangle', 0.07); setTimeout(() => beep(660, 0.08, 'triangle', 0.07), 70); setTimeout(() => beep(990, 0.12, 'triangle', 0.07), 140); },
    shield: () => beep(300, 0.4, 'sine', 0.08, 600),
    level: () => { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, 0.1, 'triangle', 0.06), i * 90)); },
    over: () => { [392, 330, 262, 196].forEach((f, i) => setTimeout(() => beep(f, 0.2, 'sawtooth', 0.05), i * 150)); }
  };

  // ---------- Estado ----------
  const BLOCK_IMG = [null, 'block_blue', 'block_yellow', 'block_red'];
  const BLOCK_COLORS = [null, '#5ab8ff', '#ffd23f', '#ff5a5f'];
  const POWERS = { rapido: 'fireball', triplo: 'star', escudo: 'heart' };
  let state = 'menu';
  let s; // estado da partida

  function newGame() {
    s = {
      dragon: { x: W / 2, y: H - 70, targetX: null, wing: 0, hurt: 0 },
      blocks: [], shots: [], parts: [], texts: [],
      score: 0, level: 1, rows: 0,
      lastRowY: 0, fireT: 0,
      rapido: 0, triplo: 0, escudo: false,
      shake: 0, time: 0
    };
    for (let i = 0; i < 4; i++) spawnRow(HUD_H + 10 + (3 - i) * (BH + ROW_GAP));
  }

  function spawnRow(y) {
    const lvl = s.level;
    const fill = Math.min(0.5 + lvl * 0.04, 0.85);
    let cols = [];
    for (let c = 0; c < COLS; c++) if (Math.random() < fill) cols.push(c);
    while (cols.length < 2) { const c = Math.floor(Math.random() * COLS); if (!cols.includes(c)) cols.push(c); }
    if (cols.length === COLS) cols.splice(Math.floor(Math.random() * COLS), 1); // sempre deixa um buraco
    const maxHp = Math.min(3, 1 + Math.floor((lvl - 1) / 2));
    for (const c of cols) {
      const hp = 1 + Math.floor(Math.random() * maxHp);
      const r = Math.random();
      let kind = null;
      if (r < 0.06) kind = 'gema';
      else if (r < 0.10) kind = Object.keys(POWERS)[Math.floor(Math.random() * 3)];
      s.blocks.push({ x: c * CELL + 3, y, w: BW, h: BH, hp, max: hp, kind, flash: 0, pop: 0 });
    }
    s.lastRowY = y;
    s.rows++;
    if (s.rows % 10 === 0) {
      s.level++;
      floatText(W / 2, H / 2, 'Nível ' + s.level + '!', '#ffcc33', 38);
      sfx.level();
    }
  }

  function wallSpeed() { return 10 + s.level * 2.4; }

  // ---------- Entrada ----------
  const keys = {};
  window.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    if (['arrowleft', 'arrowright', ' '].includes(e.key.toLowerCase())) e.preventDefault();
    if (e.key.toLowerCase() === 'p' || e.key === 'Escape') togglePause();
    if (e.key === 'Enter' && state !== 'play' && state !== 'pause') start();
  });
  window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

  function pointerX(e) {
    const r = canvas.getBoundingClientRect();
    return (e.clientX - r.left) * (W / r.width);
  }
  canvas.addEventListener('pointerdown', e => { if (state === 'play') s.dragon.targetX = pointerX(e); });
  canvas.addEventListener('pointermove', e => {
    if (state !== 'play') return;
    if (e.pointerType === 'mouse' || e.buttons || e.pressure > 0) s.dragon.targetX = pointerX(e);
  });

  // ---------- Telas ----------
  function show(id, on) { $(id).hidden = !on; }
  function start() {
    newGame();
    state = 'play';
    show('startScreen', false); show('overScreen', false); show('pauseScreen', false);
    show('hudBtns', true);
    beep(660, 0.1, 'triangle', 0.05);
  }
  function togglePause() {
    if (state === 'play') { state = 'pause'; show('pauseScreen', true); }
    else if (state === 'pause') { state = 'play'; show('pauseScreen', false); }
  }
  function gameOver() {
    state = 'over';
    s.shots = [];
    sfx.over();
    const best = Math.max(store.get('db-best', 0), s.score);
    store.set('db-best', best);
    $('finalScore').textContent = s.score;
    $('finalLevel').textContent = s.level;
    $('bestScore').textContent = best;
    show('hudBtns', false);
    setTimeout(() => show('overScreen', true), 600);
  }
  function updateSoundBtn() { $('btnSound').textContent = soundOn ? '🔊' : '🔇'; }
  $('btnStart').onclick = start;
  $('btnAgain').onclick = start;
  $('btnResume').onclick = togglePause;
  $('btnPause').onclick = togglePause;
  $('btnSound').onclick = () => { soundOn = !soundOn; store.set('db-sound', soundOn); updateSoundBtn(); };
  updateSoundBtn();
  const DEBUG = location.search.includes('debug');   // testes automáticos: sem pausa ao trocar de aba
  document.addEventListener('visibilitychange', () => { if (!DEBUG && document.hidden && state === 'play') togglePause(); });

  // ---------- Efeitos ----------
  function burst(x, y, color, n = 12, speed = 160) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = speed * (0.4 + Math.random());
      s.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.5 + Math.random() * 0.4, t: 0, color, size: 4 + Math.random() * 6 });
    }
  }
  function floatText(x, y, text, color = '#fff', size = 22) {
    s.texts.push({ x, y, text, color, size, t: 0, life: 1.1 });
  }

  // ---------- Atualização ----------
  function update(dt) {
    s.time += dt;
    const d = s.dragon;

    // movimento
    let dir = 0;
    if (keys['arrowleft'] || keys['a']) dir -= 1;
    if (keys['arrowright'] || keys['d']) dir += 1;
    if (dir) { d.x += dir * 400 * dt; d.targetX = null; }
    else if (d.targetX !== null) d.x += (d.targetX - d.x) * Math.min(1, dt * 14);
    d.x = Math.max(34, Math.min(W - 34, d.x));
    d.wing += dt * 10;

    // poderes
    s.rapido = Math.max(0, s.rapido - dt);
    s.triplo = Math.max(0, s.triplo - dt);

    // tiro automático
    s.fireT -= dt;
    if (s.fireT <= 0) {
      s.fireT = s.rapido > 0 ? 0.12 : 0.26;
      const angles = s.triplo > 0 ? [-0.22, 0, 0.22] : [0];
      for (const a of angles) s.shots.push({ x: d.x, y: d.y - 40, vx: Math.sin(a) * 560, vy: -Math.cos(a) * 560, r: 9 });
      sfx.shoot();
    }

    // muralha desce
    const fall = wallSpeed() * dt;
    for (const b of s.blocks) { b.y += fall; b.flash = Math.max(0, b.flash - dt); b.pop = Math.max(0, b.pop - dt * 6); }
    s.lastRowY += fall;
    if (s.lastRowY >= HUD_H + 4) spawnRow(s.lastRowY - BH - ROW_GAP);

    // tiros
    for (const sh of s.shots) {
      sh.x += sh.vx * dt; sh.y += sh.vy * dt;
      if (sh.x < sh.r || sh.x > W - sh.r) { sh.vx *= -1; sh.x = Math.max(sh.r, Math.min(W - sh.r, sh.x)); }
      if (Math.random() < 0.5) s.parts.push({ x: sh.x + (Math.random() - .5) * 6, y: sh.y + 10, vx: (Math.random() - .5) * 30, vy: 60, life: 0.25, t: 0, color: '#ffb02e', size: 5 });
      for (const b of s.blocks) {
        if (b.hp <= 0) continue;
        const cx = Math.max(b.x, Math.min(sh.x, b.x + b.w));
        const cy = Math.max(b.y, Math.min(sh.y, b.y + b.h));
        if ((sh.x - cx) ** 2 + (sh.y - cy) ** 2 <= sh.r * sh.r) {
          sh.dead = true;
          hitBlock(b);
          break;
        }
      }
      if (sh.y < -20) sh.dead = true;
    }
    s.shots = s.shots.filter(x => !x.dead);
    s.blocks = s.blocks.filter(b => b.hp > 0 && b.y < H + 50);

    // perigo
    const limit = d.y - 34;
    if (s.blocks.some(b => b.y + b.h >= limit)) {
      if (s.escudo) {
        s.escudo = false;
        sfx.shield();
        s.shake = 0.4;
        for (const b of s.blocks) if (b.y + b.h > H - 280) { b.hp = 0; burst(b.x + b.w / 2, b.y + b.h / 2, '#ff8fab', 10); }
        s.blocks = s.blocks.filter(b => b.hp > 0);
        floatText(d.x, d.y - 70, 'Protegido!', '#ff8fab', 28);
      } else {
        s.shake = 0.6;
        burst(d.x, d.y, '#5ac54f', 40, 260);
        gameOver();
      }
    }

    // partículas e textos
    for (const p of s.parts) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 200 * dt; }
    s.parts = s.parts.filter(p => p.t < p.life);
    for (const t of s.texts) { t.t += dt; t.y -= 40 * dt; }
    s.texts = s.texts.filter(t => t.t < t.life);
    s.shake = Math.max(0, s.shake - dt);
  }

  function hitBlock(b) {
    b.hp--;
    b.flash = 0.1;
    b.pop = 1;
    const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
    if (b.hp > 0) { sfx.hit(); burst(cx, cy, '#ffffff', 4, 80); return; }
    sfx.smash();
    const pts = 10 * b.max;
    s.score += pts;
    burst(cx, cy, BLOCK_COLORS[b.max], 16);
    if (b.kind === 'gema') {
      s.score += 50; sfx.gem();
      floatText(cx, cy, '+50', '#5ab8ff', 26);
      burst(cx, cy, '#a0e9ff', 18, 220);
    } else if (b.kind) {
      sfx.power();
      if (b.kind === 'escudo') s.escudo = true; else s[b.kind] = POWER_TIME;
      const names = { rapido: 'Fogo rápido!', triplo: 'Fogo triplo!', escudo: 'Proteção!' };
      floatText(cx, cy, names[b.kind], '#ffcc33', 24);
    } else {
      floatText(cx, cy, '+' + pts, '#ffffff', 18);
    }
  }

  // ---------- Desenho ----------
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  let cloudX = 0;
  function drawBackground(dt) {
    // céu e colinas do Kenney (256 px de altura, escalado para a tela)
    ctx.fillStyle = '#c7ecff'; ctx.fillRect(0, 0, W, H);
    const k = H / 256;
    draw('background_color_hills', 0, 0, 256 * k, H);
    cloudX = (cloudX + dt * 12) % (256 * k);
    ctx.globalAlpha = 0.9;
    draw('background_clouds', -cloudX, 0, 256 * k, H * 0.55);
    draw('background_clouds', -cloudX + 256 * k, 0, 256 * k, H * 0.55);
    ctx.globalAlpha = 1;
  }

  function drawBlock(b) {
    const grow = b.pop * 4;
    const x = b.x - grow / 2, y = b.y - grow / 2, w = b.w + grow, h = b.h + grow;
    // sombra
    ctx.fillStyle = 'rgba(43, 43, 85, .18)';
    roundRect(b.x + 3, b.y + 5, b.w, b.h, 8); ctx.fill();
    const key = b.kind === 'gema' ? 'block_coin' : b.kind ? 'block_exclamation' : BLOCK_IMG[b.hp] || BLOCK_IMG[1];
    draw(key, x, y, w, h);
    if (b.flash > 0) { ctx.fillStyle = 'rgba(255,255,255,.75)'; roundRect(x, y, w, h, 6); ctx.fill(); }
    const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
    if (b.kind) {
      const icon = b.kind === 'gema' ? 'gem_blue' : POWERS[b.kind];
      const bob = Math.sin((s.time + b.x) * 5) * 2;
      ctx.fillStyle = 'rgba(255,255,255,.85)';
      ctx.beginPath(); ctx.arc(cx, cy, 17, 0, Math.PI * 2); ctx.fill();
      draw(icon, cx - 17, cy - 17 + bob, 34, 34);
    } else if (b.max > 1) {
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = '22px KenneyFuture, sans-serif';
      ctx.lineWidth = 5; ctx.strokeStyle = INK; ctx.strokeText(b.hp, cx, cy + 1);
      ctx.fillStyle = '#ffffff'; ctx.fillText(b.hp, cx, cy + 1);
    }
  }

  // Dragão desenhado com contorno escuro, no mesmo estilo dos sprites do Kenney.
  function shape(fill, path) {
    ctx.fillStyle = fill; path(); ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.lineJoin = 'round'; ctx.stroke();
  }
  function drawDragon(d) {
    const { x, y } = d;
    const flap = Math.sin(d.wing) * 10;
    ctx.save();
    ctx.translate(x, y);
    // sombra no chão
    ctx.fillStyle = 'rgba(43,43,85,.2)';
    ctx.beginPath(); ctx.ellipse(0, 52, 30, 7, 0, 0, Math.PI * 2); ctx.fill();
    // proteção
    if (s.escudo) {
      ctx.strokeStyle = 'rgba(255, 143, 171, ' + (0.6 + Math.sin(s.time * 6) * 0.3) + ')';
      ctx.lineWidth = 6;
      ctx.beginPath(); ctx.arc(0, -4, 52, 0, Math.PI * 2); ctx.stroke();
    }
    // asas
    for (const side of [-1, 1]) {
      shape('#2fa865', () => {
        ctx.beginPath();
        ctx.moveTo(side * 12, -6);
        ctx.lineTo(side * 50, -30 - flap);
        ctx.lineTo(side * 42, -6 - flap / 2);
        ctx.lineTo(side * 46, 10);
        ctx.closePath();
      });
    }
    // cauda
    ctx.strokeStyle = INK; ctx.lineWidth = 12; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, 18); ctx.quadraticCurveTo(16 + flap / 2, 36, 4, 46); ctx.stroke();
    ctx.strokeStyle = '#5ac54f'; ctx.lineWidth = 7;
    ctx.beginPath(); ctx.moveTo(0, 18); ctx.quadraticCurveTo(16 + flap / 2, 36, 4, 46); ctx.stroke();
    shape('#ffcc33', () => { ctx.beginPath(); ctx.moveTo(4, 42); ctx.lineTo(16, 55); ctx.lineTo(-6, 53); ctx.closePath(); });
    // corpo
    shape('#5ac54f', () => { ctx.beginPath(); ctx.ellipse(0, 4, 22, 26, 0, 0, Math.PI * 2); });
    ctx.fillStyle = '#c9f5b9';
    ctx.beginPath(); ctx.ellipse(0, 10, 12, 16, 0, 0, Math.PI * 2); ctx.fill();
    // chifres
    for (const side of [-1, 1]) shape('#ffcc33', () => { ctx.beginPath(); ctx.moveTo(side * 8, -32); ctx.lineTo(side * 14, -48); ctx.lineTo(side * 2, -35); ctx.closePath(); });
    // cabeça
    shape('#5ac54f', () => { ctx.beginPath(); ctx.ellipse(0, -22, 18, 16, 0, 0, Math.PI * 2); });
    // bochechas
    ctx.fillStyle = 'rgba(255, 120, 150, .45)';
    for (const side of [-1, 1]) { ctx.beginPath(); ctx.arc(side * 11, -15, 4, 0, Math.PI * 2); ctx.fill(); }
    // olhos grandes
    for (const side of [-1, 1]) {
      shape('#ffffff', () => { ctx.beginPath(); ctx.arc(side * 7, -25, 6.5, 0, Math.PI * 2); });
      ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(side * 7 + 1, -25, 3.4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(side * 7 + 2.2, -26.5, 1.3, 0, Math.PI * 2); ctx.fill();
    }
    // sorriso
    ctx.strokeStyle = INK; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(0, -16, 5, 0.2, Math.PI - 0.2); ctx.stroke();
    ctx.restore();
  }

  function drawShot(sh) {
    const ang = Math.atan2(sh.vy, sh.vx) + Math.PI / 2;
    ctx.save();
    ctx.translate(sh.x, sh.y);
    ctx.rotate(ang);
    draw('fireball', -22, -22, 44, 44);
    ctx.restore();
  }

  function drawHud() {
    ctx.fillStyle = 'rgba(255,255,255,.88)';
    ctx.fillRect(0, 0, W, HUD_H);
    ctx.fillStyle = INK; ctx.fillRect(0, HUD_H - 4, W, 4);
    ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    draw('star', 10, 8, 34, 34);
    ctx.fillStyle = INK; ctx.font = '26px KenneyFuture, sans-serif';
    ctx.fillText(String(s.score), 50, HUD_H / 2);
    ctx.font = '17px KenneyFuture, sans-serif';
    ctx.fillText('Nv ' + s.level, 160, HUD_H / 2);
    let px = 226;
    for (const k of ['rapido', 'triplo']) {
      if (s[k] > 0) {
        draw(POWERS[k], px, 12, 26, 26);
        ctx.fillText(Math.ceil(s[k]), px + 28, HUD_H / 2);
        px += 54;
      }
    }
    if (s.escudo) draw('heart', px, 12, 26, 26);
    // linha de perigo
    ctx.strokeStyle = 'rgba(255, 90, 95, .55)'; ctx.setLineDash([10, 8]); ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, s.dragon.y - 34); ctx.lineTo(W, s.dragon.y - 34); ctx.stroke();
    ctx.setLineDash([]);
  }

  function render(dt) {
    ctx.save();
    if (s && s.shake > 0) ctx.translate((Math.random() - .5) * 10 * s.shake, (Math.random() - .5) * 10 * s.shake);
    drawBackground(dt);
    if (s) {
      for (const b of s.blocks) drawBlock(b);
      for (const sh of s.shots) drawShot(sh);
      if (state !== 'over') drawDragon(s.dragon);
      for (const p of s.parts) {
        ctx.globalAlpha = 1 - p.t / p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size / 2, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      for (const t of s.texts) {
        ctx.globalAlpha = 1 - t.t / t.life;
        ctx.font = t.size + 'px KenneyFuture, "Trebuchet MS", sans-serif';
        ctx.lineWidth = 6; ctx.strokeStyle = INK; ctx.strokeText(t.text, t.x, t.y);
        ctx.fillStyle = t.color; ctx.fillText(t.text, t.x, t.y);
      }
      ctx.globalAlpha = 1;
      drawHud();
    }
    ctx.restore();
  }

  // ---------- Laço ----------
  let last = performance.now();
  function loop(now) {
    requestAnimationFrame(loop);               // agenda antes: um erro não congela o jogo
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (state === 'play') update(dt);
    else if (state === 'over' && s) { // deixa as partículas terminarem
      for (const p of s.parts) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 200 * dt; }
      s.parts = s.parts.filter(p => p.t < p.life);
      s.shake = Math.max(0, s.shake - dt);
    }
    render(state === 'pause' ? 0 : dt);
  }
  if (DEBUG) window.__game = { get s() { return s; }, get state() { return state; }, start, update, render, keys };
  const fontReady = document.fonts ? document.fonts.load('24px KenneyFuture').catch(() => {}) : Promise.resolve();
  fontReady.then(() => requestAnimationFrame(loop));
})();
</script>
</body>
</html>
