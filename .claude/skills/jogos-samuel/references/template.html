<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Nome do Jogo</title>
<meta name="description" content="Uma frase curta sobre o jogo.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⭐</text></svg>">
<!--
  Template dos Jogos do Samuel (.claude/skills/jogos-samuel/references/template.html).
  Troque: título, descrição, ícone, PREFIX, textos das telas, update() e draw().
  Exemplo incluído: pegar estrelas que caem. Apague o exemplo e mantenha a estrutura.
-->
<style>
  :root {
    --bg: #1b1036;
    --panel: rgba(20, 10, 45, 0.88);
    --text: #fff7e6;
    --accent: #ffb703;
    --accent-2: #fb5607;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: radial-gradient(circle at 50% 0%, #3a1f6e, var(--bg) 70%);
    color: var(--text); font-family: "Trebuchet MS", system-ui, sans-serif;
    overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #wrap { position: relative; width: 100vw; height: 100vh; height: 100dvh; display: grid; place-items: center; }
  canvas { display: block; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,.5); background: #120a28; }
  .overlay { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; }
  .overlay[hidden] { display: none; }
  .card {
    background: var(--panel); border: 3px solid var(--accent); border-radius: 20px;
    padding: 24px 22px; max-width: 360px; width: 100%; text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,.5);
  }
  .card h1 { margin: 0 0 4px; font-size: 32px; color: var(--accent); text-shadow: 3px 3px 0 var(--accent-2); }
  .card h2 { margin: 0 0 8px; font-size: 28px; color: var(--accent); }
  .card p { margin: 8px 0; font-size: 20px; line-height: 1.4; }
  .big { font-size: 64px; line-height: 1; margin: 6px 0; }
  button {
    font: inherit; font-weight: bold; font-size: 24px; cursor: pointer; min-height: 64px;
    background: linear-gradient(var(--accent), var(--accent-2)); color: #2a0d00;
    border: 0; border-radius: 16px; padding: 12px 32px; margin-top: 12px;
    box-shadow: 0 5px 0 #8a2a00; transition: transform .08s;
  }
  button:active { transform: translateY(3px); box-shadow: 0 2px 0 #8a2a00; }
  button:focus-visible { outline: 4px solid #fff; outline-offset: 3px; }
  .link { display: inline-block; margin-top: 16px; padding: 8px; color: var(--text); opacity: .85; font-size: 18px; }
  #hudBtns { position: absolute; top: 10px; right: 10px; display: flex; gap: 8px; }
  #hudBtns button { font-size: 22px; min-width: 52px; min-height: 52px; padding: 6px 10px; margin: 0; box-shadow: 0 3px 0 #8a2a00; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" aria-label="Nome do Jogo"></canvas>

  <div id="hudBtns" hidden>
    <button id="btnSound" aria-label="Som">🔊</button>
    <button id="btnPause" aria-label="Pausar">⏸</button>
  </div>

  <div class="overlay" id="startScreen">
    <div class="card">
      <div class="big">⭐</div>
      <h1>Nome do Jogo</h1>
      <p>👆 Arraste para pegar as estrelas!</p>
      <button id="btnStart">Jogar!</button>
      <div><a class="link" href="../">← Voltar aos jogos</a></div>
    </div>
  </div>

  <div class="overlay" id="pauseScreen" hidden>
    <div class="card">
      <div class="big">⏸</div>
      <button id="btnResume">Continuar</button>
    </div>
  </div>

  <div class="overlay" id="overScreen" hidden>
    <div class="card">
      <div class="big">🎉</div>
      <h2>Muito bem!</h2>
      <p>⭐ <b id="finalScore">0</b></p>
      <p id="bestLine">🏆 Recorde: <b id="bestScore">0</b></p>
      <button id="btnAgain">Jogar de novo</button>
      <div><a class="link" href="../">← Voltar aos jogos</a></div>
    </div>
  </div>
</div>

<script>
(() => {
  const PREFIX = 'nj';               // prefixo das chaves salvas; único por jogo
  const W = 480, H = 720;            // resolução lógica (retrato)
  const ROUND_TIME = 45;             // rodada curta: o Samuel joga de novo

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const $ = id => document.getElementById(id);

  // ---------- Armazenamento (pode falhar em janela privada) ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem(PREFIX + '-' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(PREFIX + '-' + k, JSON.stringify(v)); } catch {} }
  };

  // ---------- Tela ----------
  function resize() {
    const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.style.width = Math.floor(W * scale) + 'px';
    canvas.style.height = Math.floor(H * scale) + 'px';
    canvas.width = Math.floor(W * dpr * scale);
    canvas.height = Math.floor(H * dpr * scale);
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- Som (criado no primeiro toque) ----------
  let audio = null;
  let soundOn = store.get('sound', true);
  function beep(freq, dur = 0.08, type = 'square', vol = 0.06, slide = 0) {
    if (!soundOn) return;
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const t = audio.currentTime;
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(audio.destination);
      o.start(t); o.stop(t + dur);
    } catch {}
  }
  const sfx = {
    pick: () => { beep(660, 0.07, 'square', 0.05); setTimeout(() => beep(990, 0.09, 'square', 0.05), 60); },
    start: () => beep(440, 0.15, 'triangle', 0.08, 440),
    end: () => { beep(523, 0.12, 'triangle', 0.08); setTimeout(() => beep(784, 0.2, 'triangle', 0.08), 120); }
  };

  // ---------- Estado ----------
  let state = 'menu';                // menu → play ⇄ pause → over
  let s = null;                      // tudo da partida atual
  let best = store.get('best', 0);

  function newGame() {
    s = {
      time: ROUND_TIME, score: 0, spawn: 0,
      player: { x: W / 2, y: H - 90, targetX: W / 2, sx: 1, sy: 1 },
      items: [], particles: [], texts: [],
      trauma: 0, shakeT: 0
    };
  }

  // ---------- Entrada: teclado + ponteiro ----------
  const keys = {};
  window.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    if ((e.key === 'p' || e.key === 'P' || e.key === 'Escape') && (state === 'play' || state === 'pause')) togglePause();
    if (e.key === 'Enter' && (state === 'menu' || state === 'over')) start();
  });
  window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
  function pointerX(e) {
    const r = canvas.getBoundingClientRect();
    return (e.clientX - r.left) / r.width * W;
  }
  canvas.addEventListener('pointerdown', e => { if (state === 'play') s.player.targetX = pointerX(e); });
  canvas.addEventListener('pointermove', e => {
    if (state === 'play' && (e.buttons || e.pointerType === 'mouse')) s.player.targetX = pointerX(e);
  });

  // ---------- Telas ----------
  function show(id, on) { $(id).hidden = !on; }
  function start() {
    newGame();
    state = 'play';
    show('startScreen', false); show('overScreen', false); show('pauseScreen', false);
    $('hudBtns').hidden = false;
    sfx.start();
  }
  function togglePause() {
    if (state === 'play') { state = 'pause'; show('pauseScreen', true); }
    else if (state === 'pause') { state = 'play'; show('pauseScreen', false); }
  }
  function endGame() {
    state = 'over';
    const record = s.score > best;
    if (record) { best = s.score; store.set('best', best); }
    $('finalScore').textContent = s.score;
    $('bestScore').textContent = best;
    $('bestLine').firstChild.textContent = record ? '🏆 Recorde novo! ' : '🏆 Recorde: ';
    $('hudBtns').hidden = true;
    show('overScreen', true);
    sfx.end();
  }
  function updateSoundBtn() { $('btnSound').textContent = soundOn ? '🔊' : '🔇'; }
  $('btnStart').onclick = start;
  $('btnAgain').onclick = start;
  $('btnResume').onclick = togglePause;
  $('btnPause').onclick = togglePause;
  $('btnSound').onclick = () => { soundOn = !soundOn; store.set('sound', soundOn); updateSoundBtn(); };
  updateSoundBtn();
  document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') togglePause(); });

  // ---------- Efeitos (game-feel) ----------
  function burst(x, y, color, n = 12, speed = 160) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = speed * (0.4 + Math.random() * 0.6);
      s.particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.6, max: 0.6, color });
    }
  }
  function floatText(x, y, text, color = '#fff', size = 24) {
    s.texts.push({ x, y, text, color, size, life: 0.8 });
  }
  function addTrauma(a) { s.trauma = Math.min(1, s.trauma + a); }

  // ---------- Simulação ----------
  function update(dt) {
    s.time -= dt;
    if (s.time <= 0) { s.time = 0; endGame(); return; }

    const p = s.player;
    const dir = (keys.arrowright || keys.d ? 1 : 0) - (keys.arrowleft || keys.a ? 1 : 0);
    if (dir) p.targetX = p.x + dir * 40;
    p.targetX = Math.max(40, Math.min(W - 40, p.targetX));
    p.x += (p.targetX - p.x) * Math.min(1, dt * 12);
    p.sx += (1 - p.sx) * Math.min(1, dt * 10);   // volta ao normal depois do "pulinho"
    p.sy += (1 - p.sy) * Math.min(1, dt * 10);

    // Dificuldade sobe devagar: mais estrelas, um pouco mais rápidas.
    const elapsed = ROUND_TIME - s.time;
    s.spawn -= dt;
    if (s.spawn <= 0) {
      s.spawn = Math.max(0.35, 0.9 - elapsed * 0.012);
      s.items.push({ x: 40 + Math.random() * (W - 80), y: -30, vy: 140 + elapsed * 3, r: 26 });
    }
    for (const it of s.items) {
      it.y += it.vy * dt;
      if (Math.abs(it.x - p.x) < 50 && Math.abs(it.y - p.y) < 45) {
        it.dead = true;
        s.score++;
        p.sx = 1.25; p.sy = 0.8;
        burst(it.x, it.y, '#ffd60a');
        floatText(it.x, it.y - 20, '+1', '#ffd60a');
        addTrauma(0.15);
        sfx.pick();
      }
      if (it.y > H + 40) it.dead = true;           // errar não tira nada: sem punição
    }
    s.items = s.items.filter(it => !it.dead);
    updateEffects(dt);
  }
  function updateEffects(dt) {
    for (const q of s.particles) { q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 300 * dt; q.life -= dt; }
    s.particles = s.particles.filter(q => q.life > 0);
    for (const t of s.texts) { t.y -= 50 * dt; t.life -= dt; }
    s.texts = s.texts.filter(t => t.life > 0);
    s.trauma = Math.max(0, s.trauma - dt * 1.5);
    s.shakeT += dt * 30;
  }

  // ---------- Desenho (só lê o estado) ----------
  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    if (s && s.trauma > 0) {
      const k = s.trauma * s.trauma * 10;
      ctx.translate(k * Math.sin(s.shakeT * 1.7), k * Math.sin(s.shakeT * 2.3));
    }
    ctx.fillStyle = '#120a28';
    ctx.fillRect(-20, -20, W + 40, H + 40);
    if (s) {
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = '44px serif';
      for (const it of s.items) ctx.fillText('⭐', it.x, it.y);
      const p = s.player;
      ctx.save();
      ctx.translate(p.x, p.y + 30);
      ctx.scale(p.sx, p.sy);
      ctx.font = '72px serif';
      ctx.fillText('🧺', 0, -30);
      ctx.restore();
      for (const q of s.particles) {
        ctx.globalAlpha = q.life / q.max;
        ctx.fillStyle = q.color;
        ctx.fillRect(q.x - 4, q.y - 4, 8, 8);
      }
      ctx.globalAlpha = 1;
      for (const t of s.texts) {
        ctx.globalAlpha = Math.min(1, t.life * 2);
        ctx.fillStyle = t.color;
        ctx.font = `bold ${t.size}px "Trebuchet MS", sans-serif`;
        ctx.fillText(t.text, t.x, t.y);
      }
      ctx.globalAlpha = 1;
      drawHud();
    }
    ctx.restore();
  }
  function drawHud() {
    ctx.fillStyle = '#fff7e6';
    ctx.font = 'bold 28px "Trebuchet MS", sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('⭐ ' + s.score, 16, 32);
    ctx.textAlign = 'center';
    ctx.fillText('⏱ ' + Math.ceil(s.time), W / 2, 32);
  }

  // ---------- Laço ----------
  let last = performance.now();
  function loop(now) {
    const dt = Math.min((now - last) / 1000, 1 / 30);
    last = now;
    if (state === 'play') update(dt);
    else if (state === 'over' && s) updateEffects(dt); // deixa as partículas terminarem
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
